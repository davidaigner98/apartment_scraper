name: Delete Most Recent Listing

on:
  workflow_dispatch:

jobs:
  delete-listing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deletion script
        run: python listings.py
