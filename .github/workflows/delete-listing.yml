
name: Delete Most Recent Listing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-listing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: listings.db
          key: listings-db-delete-${{ github.run_id }}
          restore-keys: |
            listings-db-

      - name: Verify database exists
        run: |
          if [ ! -f listings.db ]; then
            echo "ERROR: No cached listings.db was restored."
            exit 1
          fi

          python -c "import sqlite3; c=sqlite3.connect('file:listings.db?mode=ro', uri=True); print('Tables:', c.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()); c.close()"

      - name: Delete most recent listing
        run: python delete_listing.py

      - name: Save updated database cache
        uses: actions/cache/save@v4
        with:
          path: listings.db
          key: listings-db-${{ github.run_id }}
