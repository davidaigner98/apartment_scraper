
name: scrape_apartments

on:
  repository_dispatch:
    types:
      - run-scraper
  workflow_dispatch:

  # Optional: enable this if you want GitHub itself
  # to trigger the workflow every five minutes.
  # schedule:
  #   - cron: "*/5 * * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Restore model cache
      - name: Cache Qwen model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: qwen3-1.7b-q4km-v1

      # 4. Install dependencies
      - name: Install dependencies
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # 5. Restore database cache
      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: listings.db
          key: listings-db-${{ github.run_id }}
          restore-keys: |
            listings-db-

      # 6. Run scraper
      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scrape_listings.py

      # 7. Save database cache
      - name: Save database cache
        uses: actions/cache/save@v4
        with:
          path: listings.db
          key: listings-db-${{ github.run_id }}
